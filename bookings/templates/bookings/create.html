{% extends "base.html" %}
{% block title %}Book a Service{% endblock %}
{% block content %}
<div class="card">
    <h2>Book a Service</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <p>
            <label>{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </p>
        {% endfor %}
        <button type="submit">Request Booking</button>
    </form>
</div>
{% endblock %}
