{% extends "base.html" %}
{% block title %}Update Location{% endblock %}
{% block content %}
<div class="card">
    <h2>Update Location</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <p>
            <label>{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </p>
        {% endfor %}
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
