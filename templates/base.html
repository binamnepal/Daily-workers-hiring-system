{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            YOYO - Home Services
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block css %}
    {% endblock %}
</head>

<body>

    <nav class="navbar">

        <a href="{% url 'categories:list' %}" class="logo">
            YOYO
        </a>

        <ul class="nav-links">

            <li>
                <a href="{% url 'categories:list' %}">
                    Home
                </a>
            </li>

            <li>
                <a href="{% url 'categories:about' %}">
                    About
                </a>
            </li>

            <li>
                <a href="#">
                    Contact
                </a>
            </li>

            <li>
             {% if user.is_authenticated %}

    <a href="{% url 'accounts:dashboard' %}">
        {{ user.username }}
    </a>

{% else %}

    <a href="{% url 'accounts:login' %}">
        Login
    </a>

{% endif %}
            </li>

        </ul>

        <a href="#" class="book-btn">
            Book Now
        </a>

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
